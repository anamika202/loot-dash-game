<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Loot & Dash - Multiplayer Bluff Game</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;800&display=swap" rel="stylesheet">
    <style>body { font-family: 'Outfit', sans-serif; }</style>
</head>
<body class="h-full bg-slate-950 text-slate-100 flex flex-col items-center justify-center p-4">
    <div id="app" class="w-full max-w-md bg-slate-900/80 backdrop-blur-xl border border-slate-800 rounded-3xl shadow-2xl p-6 flex flex-col relative overflow-hidden min-h-[550px] justify-between">
        <div class="flex items-center justify-between pb-4 border-b border-slate-800">
            <div class="flex items-center space-x-2">
                <span class="text-2xl">💰</span>
                <h1 class="text-xl font-extrabold bg-gradient-to-r from-amber-400 to-rose-500 bg-clip-text text-transparent">Loot & Dash</h1>
            </div>
            <div id="connection-status" class="text-xs px-2 py-1 bg-amber-500/10 text-amber-400 border border-amber-500/20 rounded-full font-medium">Connecting...</div>
        </div>
        <div id="view-container" class="flex-1 flex flex-col justify-center my-4"></div>
        <div class="text-center text-xs text-slate-500 pt-3 border-t border-slate-800/60">No login required • Real-time Multiplayer</div>
    </div>

    <div id="modal" class="fixed inset-0 bg-slate-950/80 backdrop-blur-sm hidden items-center justify-center p-4 z-50">
        <div class="bg-slate-900 border border-slate-800 rounded-2xl p-6 max-w-xs w-full text-center shadow-2xl">
            <h3 id="modal-title" class="text-lg font-bold text-white mb-2">Notice</h3>
            <p id="modal-message" class="text-sm text-slate-300 mb-5">Something happened!</p>
            <button onclick="closeModal()" class="w-full py-2.5 bg-gradient-to-r from-amber-500 to-rose-500 text-white font-bold rounded-xl shadow-lg">Got it</button>
        </div>
    </div>
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously, signInWithCustomToken } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, doc, setDoc, getDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        const appId = typeof __app_id !== 'undefined' ? __app_id : 'loot-dash-default-app';
        let firebaseConfig = {};
        try { firebaseConfig = JSON.parse(typeof __firebase_config !== 'undefined' ? __firebase_config : '{}'); } catch (e) { firebaseConfig = {}; }
        
        let app, db, auth, currentUser = null;
        let currentRoomId = null;
        let myName = '';
        let myId = 'user_' + Math.random().toString(36).substring(2, 8);
        let isOnline = false;

        const statusEl = document.getElementById('connection-status');
        const viewContainer = document.getElementById('view-container');

        try {
            if (Object.keys(firebaseConfig).length > 0) {
                app = initializeApp(firebaseConfig);
                db = getFirestore(app);
                auth = getAuth(app);
                if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
                    signInWithCustomToken(auth, __initial_auth_token).then(() => {
                        currentUser = auth.currentUser; if(currentUser) myId = currentUser.uid;
                        isOnline = true; updateStatus("Online", "emerald");
                    }).catch(() => fallbackInit());
                } else {
                    signInAnonymously(auth).then(() => {
                        currentUser = auth.currentUser; if(currentUser) myId = currentUser.uid;
                        isOnline = true; updateStatus("Online", "emerald");
                    }).catch(() => fallbackInit());
                }
            } else { fallbackInit(); }
        } catch (e) { fallbackInit(); }

        function fallbackInit() { isOnline = false; updateStatus("Local Mode", "amber"); renderHome(); }
        function updateStatus(text, color) {
            statusEl.textContent = text;
            statusEl.className = color === 'emerald' ? "text-xs px-2 py-1 bg-emerald-500/10 text-emerald-400 border border-emerald-500/20 rounded-full font-medium" : "text-xs px-2 py-1 bg-amber-500/10 text-amber-400 border border-amber-500/20 rounded-full font-medium";
            renderHome();
        }

        window.showModal = function(title, message) {
            document.getElementById('modal-title').textContent = title;
            document.getElementById('modal-message').textContent = message;
            document.getElementById('modal').classList.remove('hidden');
            document.getElementById('modal').classList.add('flex');
        }
        window.closeModal = function() {
            document.getElementById('modal').classList.remove('flex');
            document.getElementById('modal').classList.add('hidden');
        }

        function renderHome() {
            viewContainer.innerHTML = `
                <div class="space-y-6 text-center">
                    <div>
                        <h2 class="text-2xl font-bold text-white mb-2">Collect or Steal?</h2>
                        <p class="text-sm text-slate-400">Outsmart your friends in this high-stakes bluffing game.</p>
                    </div>
                    <div class="space-y-3">
                        <input type="text" id="player-name-input" placeholder="Enter your nickname..." maxlength="12" class="w-full px-4 py-3 bg-slate-950 border border-slate-800 rounded-xl text-white placeholder-slate-500 focus:outline-none focus:border-amber-500 text-center font-semibold" />
                        <button onclick="handleCreateRoom()" class="w-full py-3.5 bg-gradient-to-r from-amber-500 to-rose-500 text-white font-bold rounded-xl shadow-lg">Create Room</button>
                        <div class="flex space-x-2 pt-2">
                            <input type="text" id="room-code-input" placeholder="Room Code" maxlength="6" class="w-1/2 px-4 py-3 bg-slate-950 border border-slate-800 rounded-xl text-white placeholder-slate-500 focus:outline-none focus:border-indigo-500 uppercase text-center font-bold tracking-widest" />
                            <button onclick="handleJoinRoom()" class="w-1/2 py-3 bg-slate-800 border border-slate-700 text-white font-bold rounded-xl">Join Room</button>
                        </div>
                    </div>
                </div>
            `;
        }

        window.handleCreateRoom = async function() {
            const nameInput = document.getElementById('player-name-input').value.trim();
            if (!nameInput) { showModal("Name Required", "Please enter your nickname first!"); return; }
            myName = nameInput;
            currentRoomId = Math.random().toString(36).substring(2, 8).toUpperCase();

            const initialRoomData = {
                hostId: myId, status: 'lobby', round: 1, maxRounds: 5,
                players: { [myId]: { id: myId, name: myName, score: 0, choice: null } },
                lastAction: `${myName} created the room.`
            };

            try {
                if (isOnline && db) {
                    const roomRef = doc(db, 'artifacts', appId, 'public', 'data', `rooms_${currentRoomId}`);
                    await setDoc(roomRef, initialRoomData);
                    subscribeToRoom(currentRoomId);
                } else {
                    localStorage.setItem(`room_${currentRoomId}`, JSON.stringify(initialRoomData));
                    startLocalPolling(currentRoomId);
                }
            } catch (err) {
                localStorage.setItem(`room_${currentRoomId}`, JSON.stringify(initialRoomData));
                startLocalPolling(currentRoomId);
            }
        };

        window.handleJoinRoom = async function() {
            const nameInput = document.getElementById('player-name-input').value.trim();
            const codeInput = document.getElementById('room-code-input').value.trim().toUpperCase();

            if (!nameInput) { showModal("Name Required", "Please enter your nickname!"); return; }
            if (!codeInput) { showModal("Invalid Code", "Enter a valid room code."); return; }

            myName = nameInput;
            currentRoomId = codeInput;

            try {
                if (isOnline && db) {
                    const roomRef = doc(db, 'artifacts', appId, 'public', 'data', `rooms_${currentRoomId}`);
                    const snap = await getDoc(roomRef);
                    if (!snap.exists()) { showModal("Not Found", "Room code does not exist."); return; }
                    const data = snap.data();
                    if (data.status !== 'lobby') { showModal("Started", "Game already in progress!"); return; }
                    data.players[myId] = { id: myId, name: myName, score: 0, choice: null };
                    await setDoc(roomRef, data);
                    subscribeToRoom(currentRoomId);
                } else {
                    const localData = localStorage.getItem(`room_${currentRoomId}`);
                    if (!localData) { showModal("Not Found", "Room code does not exist locally."); return; }
                    const data = JSON.parse(localData);
                    data.players[myId] = { id: myId, name: myName, score: 0, choice: null };
                    localStorage.setItem(`room_${currentRoomId}`, JSON.stringify(data));
                    startLocalPolling(currentRoomId);
                }
            } catch (err) { showModal("Error", "Could not join room."); }
        };

        function subscribeToRoom(roomId) {
            const roomRef = doc(db, 'artifacts', appId, 'public', 'data', `rooms_${roomId}`);
            onSnapshot(roomRef, (docSnap) => {
                if (!docSnap.exists()) return;
                handleRoomData(docSnap.data());
            });
        }

        function startLocalPolling(roomId) {
            setInterval(() => {
                const localData = localStorage.getItem(`room_${roomId}`);
                if (localData) handleRoomData(JSON.parse(localData));
            }, 1000);
        }

        function handleRoomData(data) {
            if (data.status === 'lobby') renderLobby(data);
            else if (data.status === 'playing') renderGame(data);
            else if (data.status === 'round_over') renderRoundOver(data);
            else if (data.status === 'game_over') renderGameOver(data);
        }

        function renderLobby(data) {
            const playersList = Object.values(data.players).map(p => `
                <div class="flex items-center justify-between p-3 bg-slate-950/60 border border-slate-800 rounded-xl">
                    <span class="font-semibold text-white">${p.name}</span>
                    ${p.id === data.hostId ? '<span class="text-xs bg-amber-500/10 text-amber-400 border px-2 py-0.5 rounded-md">Host</span>' : ''}
                </div>
            `).join('');

            const isHost = myId === data.hostId;
            viewContainer.innerHTML = `
                <div class="space-y-4">
                    <div class="text-center bg-slate-950/40 p-3 rounded-2xl border border-slate-800">
                        <span class="text-xs text-slate-400 uppercase tracking-widest font-bold">Room Code</span>
                        <div class="text-3xl font-extrabold text-amber-400 tracking-wider mt-1">${currentRoomId}</div>
                    </div>
                    <div class="space-y-2 max-h-40 overflow-y-auto">${playersList}</div>
                    ${isHost ? `<button onclick="startGame()" class="w-full py-3.5 bg-gradient-to-r from-emerald-500 to-teal-600 text-white font-bold rounded-xl shadow-lg">Start Game</button>` : `<div class="text-center text-sm text-slate-400 py-2">Waiting for host...</div>`}
                </div>
            `;
        }

        window.startGame = async function() {
            updateRoomData(data => {
                data.status = 'playing';
                data.round = 1;
                Object.keys(data.players).forEach(pid => data.players[pid].choice = null);
            });
        };

        function renderGame(data) {
            const me = data.players[myId] || {};
            const hasChosen = me.choice !== null;

            viewContainer.innerHTML = `
                <div class="space-y-4">
                    <div class="flex justify-between items-center bg-slate-950/40 px-4 py-2.5 rounded-xl border border-slate-800">
                        <span class="text-xs font-bold text-slate-400">ROUND ${data.round} / ${data.maxRounds}</span>
                        <span class="text-xs font-bold text-amber-400">Score: ${me.score || 0} pts</span>
                    </div>
                    ${!hasChosen ? `
                        <div class="space-y-3 pt-4">
                            <div class="text-center text-sm font-semibold text-white">Make Your Secret Move:</div>
                            <div class="grid grid-cols-2 gap-3">
                                <button onclick="makeChoice('collect')" class="p-4 bg-emerald-600/20 border border-emerald-500/40 rounded-2xl flex flex-col items-center">
                                    <span class="text-2xl mb-1">🪙</span>
                                    <span class="font-bold text-emerald-400 text-sm">Collect (+10)</span>
                                </button>
                                <button onclick="makeChoice('steal')" class="p-4 bg-rose-600/20 border border-rose-500/40 rounded-2xl flex flex-col items-center">
                                    <span class="text-2xl mb-1">🥷</span>
                                    <span class="font-bold text-rose-400 text-sm">Steal (Bluff)</span>
                                </button>
                            </div>
                        </div>
                    ` : `<div class="text-center py-6 bg-slate-950/60 rounded-2xl border border-slate-800 space-y-2"><div class="text-3xl">🔒</div><div class="font-bold text-white text-sm">Locked In! Waiting for others...</div></div>`}
                </div>
            `;
        }

        window.makeChoice = async function(choice) {
            updateRoomData(data => {
                data.players[myId].choice = choice;
                const allChosen = Object.values(data.players).every(p => p.choice !== null);
                if (allChosen) {
                    const players = Object.values(data.players);
                    const collectors = players.filter(p => p.choice === 'collect');
                    const stealers = players.filter(p => p.choice === 'steal');

                    if (stealers.length === 0) {
                        collectors.forEach(p => data.players[p.id].score += 10);
                        data.roundSummary = "Everyone collected! All gained +10 pts.";
                    } else if (collectors.length === 0) {
                        data.roundSummary = "Everyone stole! Nobody got points.";
                    } else {
                        stealers.forEach(p => data.players[p.id].score += 15);
                        data.roundSummary = `${stealers.length} Stealer(s) successfully looted collectors!`;
                    }
                    data.status = 'round_over';
                }
            });
        };

        async function updateRoomData(updater) {
            if (isOnline && db) {
                const roomRef = doc(db, 'artifacts', appId, 'public', 'data', `rooms_${currentRoomId}`);
                const snap = await getDoc(roomRef);
                if (!snap.exists()) return;
                const data = snap.data();
                updater(data);
                await setDoc(roomRef, data);
            } else {
                const localData = localStorage.getItem(`room_${currentRoomId}`);
                if (!localData) return;
                const data = JSON.parse(localData);
                updater(data);
                localStorage.setItem(`room_${currentRoomId}`, JSON.stringify(data));
            }
        }

        window.renderRoundOver = function(data) {
            const isHost = myId === data.hostId;
            const scoresList = Object.values(data.players).map(p => `
                <div class="flex justify-between p-2 bg-slate-950/40 rounded-lg text-sm">
                    <span>${p.name} (${p.choice ? p.choice.toUpperCase() : '...'})</span>
                    <span class="font-bold text-amber-400">${p.score} pts</span>
                </div>
            `).join('');

            viewContainer.innerHTML = `
                <div class="space-y-4 text-center">
                    <h3 class="text-lg font-bold text-white">Round Results</h3>
                    <p class="text-xs text-amber-400 bg-amber-500/10 p-2 rounded-lg border border-amber-500/20">${data.roundSummary}</p>
                    <div class="space-y-1.5 max-h-32 overflow-y-auto text-left">${scoresList}</div>
                    ${isHost ? `<button onclick="nextRound()" class="w-full py-3 bg-emerald-600 text-white font-bold rounded-xl">Next Round</button>` : `<p class="text-xs text-slate-400">Waiting for host to continue...</p>`}
                </div>
            `;
        }

        window.nextRound = async function() {
            updateRoomData(data => {
                if (data.round >= data.maxRounds) {
                    data.status = 'game_over';
                } else {
                    data.round += 1;
                    data.status = 'playing';
                    Object.keys(data.players).forEach(pid => data.players[pid].choice = null);
                }
            });
        };

        function renderGameOver(data) {
            const sorted = Object.values(data.players).sort((a,b) => b.score - a.score);
            viewContainer.innerHTML = `
                <div class="space-y-4 text-center">
                    <h2 class="text-2xl font-extrabold text-amber-400">🏆 Game Over! 🏆</h2>
                    <div class="p-3 bg-slate-950/60 rounded-xl border border-slate-800 text-left space-y-2">
                        <div class="text-xs font-bold text-slate-400 uppercase">Final Standings</div>
                        ${sorted.map((p, idx) => `<div class="flex justify-between text-sm"><span class="font-semibold">#${idx+1} ${p.name}</span><span class="font-bold text-amber-400">${p.score} pts</span></div>`).join('')}
                    </div>
                    <button onclick="location.reload()" class="w-full py-3 bg-gradient-to-r from-amber-500 to-rose-500 text-white font-bold rounded-xl">Play Again</button>
                </div>
            `;
        }
    </script>
</body>
</html>
